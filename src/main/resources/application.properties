spring.application.name=fitlog

#Configuracion del servidor y el puerto del backend
server.port=8080

#Configuracion de la conexion a la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/fitlog_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=adminadmin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA (para que cree y actualice las tablas automáticamente a partir de tus clases)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect